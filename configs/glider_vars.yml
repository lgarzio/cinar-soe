time:
  dtype: int64
  dims: time
  attrs:
    units: seconds since 1970-01-01T00:00:00Z
    standard_name: time
    time_origin: 01-JAN-1970 00:00:00
cruise_deployment:
  dtype: object
  dims: time
  attrs:
    comment: Cruise/Deployment ID (either cruise ID or glider deployment ID)
    long_name: Cruise/Deployment ID
lat:
  dtype: float32
  dims: time
  attrs:
    units: degrees_north
    long_name: Latitude
    standard_name: latitude
lon:
  dtype: float32
  dims: time
  attrs:
    units: degrees_east
    long_name: Longitude
    standard_name: longitude
depth_surface_sample:
  dtype: float32
  dims: time
  attrs:
    units: m
    long_name: Depth
    description: Depth at which the surface sample was collected
depth_bottom_sample:
  dtype: float32
  dims: time
  attrs:
    units: m
    long_name: Depth
    description: Depth at which the bottom sample was collected
station_water_depth:
  dtype: float32
  dims: time
  attrs:
    units: m
    long_name: Bottom Depth
    description: Depth of water column at the sampling station
    comment: Bottom depth was calculated using the sample coordinates and GEBCO’s gridded global
      bathymetry (https://download.gebco.net/)
pH_surface:
  dtype: float32
  dims: time
  attrs:
    units: '1'
    long_name: Surface pH
    description: Surface pH is the the median of the values recorded at the top of a glider profile 
      (between 2-4m depth), provided the glider profile reached at least 10m depth.
pH_bottom:
  dtype: float32
  dims: time
  attrs:
    units: '1'
    long_name: Bottom pH
    description: Bottom pH is the the median of the values within the deepest 1m of a glider 
      profile, provided the sampling depth was within 20% of total water column depth, capped at a difference of 40m. 
      Samples recorded deeper than the water depth were retained and the difference is attributed to the 
      coarse resolution and therefore lower accuracy of the bathymetry data.
omega_surface:
  dtype: float32
  dims: time
  attrs:
    units: '1'
    long_name: Surface Aragonite Saturation State
    description: Surface aragonite saturation state is the the median of the values recorded at the 
      top of a glider profile (between 2-4m depth), provided the glider profile reached at least 10m depth.
    comment: Calculated using PyCO2SYS (Humphreys et al. 2020) with inputs of 
      pressure, temperature, salinity, total alkalinity, and pH.
omega_bottom:
  dtype: float32
  dims: time
  attrs:
    units: '1'
    long_name: Bottom Aragonite Saturation State
    description: Bottom aragonite saturation state is the the median of the values within the deepest 1m of a glider 
      profile, provided the sampling depth was within 20% of total water column depth, capped at a difference of 40m. 
      Samples recorded deeper than the water depth were retained and the difference is attributed to the 
      coarse resolution and therefore lower accuracy of the bathymetry data.
    comment: Calculated using PyCO2SYS (Humphreys et al. 2020) with inputs of 
      pressure, temperature, salinity, total alkalinity, and pH.
temperature_surface:
  dtype: float32
  dims: time
  attrs:
    units: C
    long_name: Surface Temperature
    description: Surface temperature is the the median of the values recorded at the 
      top of a glider profile (between 2-4m depth), provided the glider profile reached at least 10m depth.
temperature_bottom:
  dtype: float32
  dims: time
  attrs:
    units: C
    long_name: Bottom Temperature
    description: Bottom temperature is the the median of the values within the deepest 1m of a glider 
      profile, provided the sampling depth was within 20% of total water column depth, capped at a difference of 40m. 
      Samples recorded deeper than the water depth were retained and the difference is attributed to the 
      coarse resolution and therefore lower accuracy of the bathymetry data.
salinity_surface:
  dtype: float32
  dims: time
  attrs:
    units: '1'
    long_name: Surface Salinity
    description: Surface salinity is the the median of the values recorded at the 
      top of a glider profile (between 2-4m depth), provided the glider profile reached at least 10m depth.
salinity_bottom:
  dtype: float32
  dims: time
  attrs:
    units: '1'
    long_name: Bottom Salinity
    description: Bottom salinity is the the median of the values within the deepest 1m of a glider 
      profile, provided the sampling depth was within 20% of total water column depth, capped at a difference of 40m. 
      Samples recorded deeper than the water depth were retained and the difference is attributed to the 
      coarse resolution and therefore lower accuracy of the bathymetry data.
total_alkalinity_surface:
  dtype: float32
  dims: time
  attrs:
    units: umol kg-1
    long_name: Surface Total Alkalinity
    description: "Surface TA is the the median of the values at the top of a glider profile (between 2-4m depth), provided the glider profile reached at least 10m depth. For Mid-Atlantic Bight deployments, TA was estimated from salinity using a linear relationship (TA = m * salinity + b) with the following seasonal coefficients ({'DJF': {'m': 48.71, 'b': 601.75}, 'MAM': {'m': 42.37, 'b': 817.59}, 'JJA': {'m': 50.75, 'b': 541.81}, 'SON': {'m': 46.42, 'b': 687.99}}) determined from in-situ water sampling data taken during glider deployments and recoveries in addition to ship-based water samples in the Mid-Atlantic Bight region as described in Wright-Fairbanks et al 2020 https://doi.org/10.1029/2020JC016505. For Gulf of Maine deployments, TA was estimated from salinity using the linear relationship (TA = 47.6 * salinity + 643.0) taken from Hunt et al 2021, figure 6, Historical regression or Gulf of Maine: https://doi.org/10.1016/j.marchem.2021.103960"
total_alkalinity_bottom:
  dtype: float32
  dims: time
  attrs:
    units: umol kg-1
    long_name: Bottom Total Alkalinity
    description: "Bottom TA is the the median of the values within the deepest 1m of a glider profile, provided the sampling depth was within 20% of total water column depth, capped at a difference of 40m. Samples recorded deeper than the water depth were retained and the difference is attributed to the coarse resolution and therefore lower accuracy of the bathymetry data. For Mid-Atlantic Bight deployments, TA was estimated from salinity using a linear relationship (TA = m * salinity + b) with the following seasonal coefficients ({'DJF': {'m': 48.71, 'b': 601.75}, 'MAM': {'m': 42.37, 'b': 817.59}, 'JJA': {'m': 50.75, 'b': 541.81}, 'SON': {'m': 46.42, 'b': 687.99}}) determined from in-situ water sampling data taken during glider deployments and recoveries in addition to ship-based water samples in the Mid-Atlantic Bight region as described in Wright-Fairbanks et al 2020 https://doi.org/10.1029/2020JC016505. For Gulf of Maine deployments, TA was estimated from salinity using the linear relationship (TA = 47.6 * salinity + 643.0) taken from Hunt et al 2021, figure 6, Historical regression for Gulf of Maine: https://doi.org/10.1016/j.marchem.2021.103960"
